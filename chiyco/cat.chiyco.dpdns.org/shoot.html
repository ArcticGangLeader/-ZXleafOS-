// ============== 跑图枪战 WebSocket（真人对战同步） ==============
const _shootWsColors = ['#ab47bc','#66bb6a','#ffa726','#26c6da','#ec407a','#7e57c2','#ff7043','#26a69a'];
function _pickWsColor(username) {
  let h = 0; for (let i = 0; i < username.length; i++) h = (h * 31 + username.charCodeAt(i)) >>> 0;
  return _shootWsColors[h % _shootWsColors.length];
}
function connectShootWS() {
  if (game.ws) { try { game.ws.close(); } catch (e) {} game.ws = null; }
  if (!state.workerUrl || !state.token) return;
  try {
    const base = state.workerUrl.replace(/^https?:\/\//, '');
    const proto = state.workerUrl.startsWith('https') ? 'wss' : 'ws';
    const wsUrl = `${proto}://${base}/shoot-ws?map=${encodeURIComponent(state.selectedMap)}&token=${encodeURIComponent(state.token)}`;
    const ws = new WebSocket(wsUrl);
    game.ws = ws;
    ws.onopen = () => {
      console.log('[shoot-ws] connected, map=' + state.selectedMap);
      const wsStatus = $('wsStatus'); if (wsStatus) wsStatus.textContent = '🟢';
    };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (!m || !m.type) return;
      if (m.type === 'hello') {
        // 初次加入：服务端推一份当前房间里其他人（不含自己）
        if (Array.isArray(m.players)) {
          for (const p of m.players) {
            if (!game.otherPlayers.has(p.username)) {
              game.otherPlayers.set(p.username, {
                x: 0, y: 0, vx: 0, vy: 0, hp: getHpMax(), weapon: 'pistol', ammo: 0, facing: 0,
                nickname: p.nickname || p.username,
                username: p.username,
                color: _pickWsColor(p.username),
                r: 16, lastTs: Date.now(),
              });
            }
          }
        }
        updatePlayerCount();
      } else if (m.type === 'join') {
        if (m.username && m.username !== state.username && !game.otherPlayers.has(m.username)) {
          game.otherPlayers.set(m.username, {
            x: 0, y: 0, vx: 0, vy: 0, hp: getHpMax(), weapon: 'pistol', ammo: 0, facing: 0,
            nickname: m.nickname || m.username,
            username: m.username,
            color: _pickWsColor(m.username),
            r: 16, lastTs: Date.now(),
          });
          updatePlayerCount();
        }
      } else if (m.type === 'leave') {
        if (m.username && game.otherPlayers.has(m.username)) {
          game.otherPlayers.delete(m.username);
          updatePlayerCount();
        }
      } else if (m.type === 'pos') {
        const op = game.otherPlayers.get(m.username);
        if (op) {
          // ===== 平滑插值缓冲 =====
          // 每收到一帧位置就把"上一帧 + 当前帧"压入历史，然后渲染时按时间戳 lerp
          // 这样网络抖动（50~200ms）看起来像平滑移动，不会瞬移/卡顿
          if (!op._buf) op._buf = []; // 历史缓冲：[{t,x,y,vx,vy,facing}, ...]
          const recvT = Date.now();
          // RTT 估算（首包不参与插值计算，仅记录）
          if (m.t) {
            const rtt = recvT - m.t;
            op._lastRtt = rtt;
            // 全局平均 RTT（最多保留最近 20 个）
            game._rtts = game._rtts || [];
            game._rtts.push(rtt);
            if (game._rtts.length > 20) game._rtts.shift();
          }
          // 限制缓冲最多 8 条（防止极端情况下无限增长）
          op._buf.push({
            t: recvT,
            x: +m.x || 0, y: +m.y || 0,
            vx: +m.vx || 0, vy: +m.vy || 0,
            facing: +m.facing || 0,
            seq: m.seq || 0,
          });
          if (op._buf.length > 8) op._buf.shift();
          // 兼容旧的渲染路径：保留这些字段
          op.x = +m.x || 0;
          op.y = +m.y || 0;
          op.vx = +m.vx || 0;
          op.vy = +m.vy || 0;
          op.facing = +m.facing || 0;
          if (m.hp !== undefined) op.hp = +m.hp;
          if (m.weapon) op.weapon = m.weapon;
          if (m.ammo !== undefined) op.ammo = +m.ammo;
          op.lastTs = Date.now();
        }
      } else if (m.type === 'shoot') {
        // 收到别人开枪 → 在我本地生成一颗"来自别人的子弹"
        const w = WEAPONS[m.weapon] || WEAPONS.pistol;
        const dmg = (typeof getWeaponDmg === 'function') ? getWeaponDmg(m.weapon) : (w.dmg || 20);
        game.remoteBullets.push({
          x: +m.x, y: +m.y, angle: +m.angle, weapon: m.weapon || 'pistol',
          vx: Math.cos(+m.angle) * 18,
          vy: Math.sin(+m.angle) * 18,
          dmg,
          life: (w.range || 400) / 18 * 16,
          knock: w.knockback || 6,
          color: '#ff5252',
          owner: m.username,
        });
      }
    };
    ws.onclose = (e) => {
      console.log('[shoot-ws] closed code=' + e.code + ' reason=' + e.reason);
      game.ws = null;
      const wsStatus = $('wsStatus'); if (wsStatus) wsStatus.textContent = '🔴';
      // 5 秒后重连（仅当游戏还在进行）
      setTimeout(() => { if (game && game.player && game.player.hp > 0) connectShootWS(); }, 5000);
    };
    ws.onerror = (e) => {
      console.warn('[shoot-ws] error', e);
      const wsStatus = $('wsStatus'); if (wsStatus) wsStatus.textContent = '⚫';
    };
  } catch (e) { console.warn('[shoot-ws] connect failed', e); game.ws = null; }
}
function updatePlayerCount() {
  const el = $('playerCount');
  if (el) el.textContent = String((game.otherPlayers ? game.otherPlayers.size : 0) + 1);
}
function sendShootWS(x, y, angle, weapon) {
  if (!game.ws || game.ws.readyState !== 1) return;
  try { game.ws.send(JSON.stringify({ type: 'shoot', x, y, angle, weapon })); } catch (e) {}
}
function resizeCanvas() {
  const canvas = game.canvas;
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  game.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  game.w = window.innerWidth;
  game.h = window.innerHeight;
}
function spawnBot(name) {
  const map = game.map;
  const colors = ['#ff5252','#4fc3f7','#ab47bc','#66bb6a','#ffa726','#26c6da','#ec407a'];
  // 找一个不在墙内的安全点（同样套用 findSafeSpawn；bot r 也是 16）
  const safe = findSafeSpawn(map, 16);
  const sx = safe.x, sy = safe.y;
  // ===== 统一 bot 配置：所有 bot 同一种武器 + 同一种行为模板 =====
  const botWeapon = 'rifle';
  const w = WEAPONS[botWeapon];
  const speed = w.speed * 0.78;
  const waypoints = (map._waypoints) || (map._waypoints = (function(){
    const w = map.size.w, h = map.size.h, m = 200;
    return [
      { x: m,         y: m       },
      { x: w - m,     y: m       },
      { x: m,         y: h - m   },
      { x: w - m,     y: h - m   },
      { x: w/2,       y: h/2     },
      { x: w*0.3,     y: h*0.65  },
    ];
  })());
  const wp = pick(waypoints);
  game.enemies.push({
    x: sx,
    y: sy,
    r: 16,
    hp: getHpMax() * 0.7,
    maxHp: getHpMax() * 0.7,
    weapon: botWeapon,
    ammo: getWeaponAmmo(botWeapon),
    reloading: 0,
    color: pick(colors),
    name: name || 'Bot',
    vel: { x: 0, y: 0 },
    lastFire: 0,
    targetX: wp.x,
    targetY: wp.y,
    moveTimer: 0,
    isPlayer: false,
    state: 'PATROL',
    patrolIdx: waypoints.indexOf(wp),
    lastSeenPlayerTs: 0,
    speed: speed,
    fovRange: 560,
    fireRange: w.range * 0.85,
    retreatHp: 25,
  });
}
function renderWeaponBar() {
  const owned = Object.keys(WEAPONS).filter(k => state.weapons[k] && state.weapons[k].owned);
  $('weaponBar').innerHTML = owned.map(k => {
    const w = WEAPONS[k];
    const sel = k === game.player.weapon;
    return `<div class="slot ${sel ? 'active' : ''}" onclick="switchWeapon('${k}')">
      <div class="icon">${w.icon}</div>
      <div class="name">${w.name} Lv.${state.weapons[k].level}</div>
    </div>`;
  }).join('');
}
function switchWeapon(k) {
  if (!state.weapons[k] || !state.weapons[k].owned) return;
  game.player.weapon = k;
  game.player.ammo = getWeaponAmmo(k);
  game.player.reloading = 0;
  renderWeaponBar();
}

// ============== 游戏循环 ==============
function gameLoop() {
  if (!game.running) return;
  game.rafId = requestAnimationFrame(gameLoop);
  update();
  render();
}
function update() {
  const p = game.player;
  if (!p || p.hp <= 0) return;
  const map = game.map;
  // 玩家移动
  let mx = 0, my = 0;
  if (game.joystick.active) { mx = game.joystick.dx; my = game.joystick.dy; }
  if (game.keys['w'] || game.keys['arrowup']) my -= 1;
  if (game.keys['s'] || game.keys['arrowdown']) my += 1;
  if (game.keys['a'] || game.keys['arrowleft']) mx -= 1;
  if (game.keys['d'] || game.keys['arrowright']) mx += 1;
  const len = Math.hypot(mx, my);
  if (len > 0) { mx /= len; my /= len; }
  const spd = WEAPONS[p.weapon].speed;
  const nx = p.x + mx * spd;
  const ny = p.y + my * spd;
  if (!collideWalls(nx, p.y, p.r)) p.x = nx;
  if (!collideWalls(p.x, ny, p.r)) p.y = ny;
  p.x = Math.max(p.r, Math.min(map.size.w - p.r, p.x));
  p.y = Math.max(p.r, Math.min(map.size.h - p.r, p.y));
  p.vel.x = mx * spd; p.vel.y = my * spd;
  // 装弹
  if (p.reloading > 0) {
    p.reloading -= 16;
    if (p.reloading <= 0) { p.ammo = getWeaponAmmo(p.weapon); p.reloading = 0; }
  }
  // 弹药为 0 自动换弹
  if (p.ammo <= 0 && p.reloading <= 0) { p.reloading = WEAPONS[p.weapon].reload; }
  // 摄像机
  game.camera.x = p.x - game.w / 2;
  game.camera.y = p.y - game.h / 2;
  // 子弹
  for (let i = game.bullets.length - 1; i >= 0; i--) {
    const b = game.bullets[i];
    b.x += b.vx; b.y += b.vy;
    b.life -= 16;
    if (b.life <= 0 || b.x < 0 || b.x > map.size.w || b.y < 0 || b.y > map.size.h || collideWalls(b.x, b.y, 2)) {
      game.bullets.splice(i, 1); continue;
    }
    // 命中检测
    const targets = b.isPlayerBullet ? game.enemies : [p];
    for (let j = targets.length - 1; j >= 0; j--) {
      const t = targets[j];
      if (!t || t.hp <= 0) continue;
      if (Math.hypot(b.x - t.x, b.y - t.y) < t.r + 4) {
        t.hp -= b.dmg;
        // 击退
        const ang = Math.atan2(b.vy, b.vx);
        t.x += Math.cos(ang) * b.knock;
        t.y += Math.sin(ang) * b.knock;
        spawnDamage(b.x, b.y, b.dmg);
        game.bullets.splice(i, 1);
        if (t.hp <= 0) {
          onKill(t, b.isPlayerBullet);
        }
        break;
      }
    }
  }
  // 远端（其他人发射的）子弹 → 命中本地玩家
  if (Array.isArray(game.remoteBullets)) {
    for (let i = game.remoteBullets.length - 1; i >= 0; i--) {
      const b = game.remoteBullets[i];
      b.x += b.vx; b.y += b.vy;
      b.life -= 16;
      if (b.life <= 0 || b.x < 0 || b.x > map.size.w || b.y < 0 || b.y > map.size.h || collideWalls(b.x, b.y, 2)) {
        game.remoteBullets.splice(i, 1); continue;
      }
      if (Math.hypot(b.x - p.x, b.y - p.y) < p.r + 4) {
        p.hp -= b.dmg;
        const ang = Math.atan2(b.vy, b.vx);
        p.x += Math.cos(ang) * b.knock;
        p.y += Math.sin(ang) * b.knock;
        spawnDamage(b.x, b.y, b.dmg);
        game.remoteBullets.splice(i, 1);
      }
    }
  }
  // 过期清理其他玩家（>8s 没收到 pos → 视为掉线）
  if (game.otherPlayers && game.otherPlayers.size) {
    const now = Date.now();
    let changed = false;
    for (const [uname, op] of game.otherPlayers) {
      if (now - op.lastTs > 8000) { game.otherPlayers.delete(uname); changed = true; }
    }
    if (changed) updatePlayerCount();
  }
  // 敌人 AI
  for (const e of game.enemies) {
    if (e.hp <= 0) continue;
    aiUpdate(e);
  }
  // ===== 掉落物：缓动 + 自动拾取 + 寿命衰减 =====
  if (Array.isArray(game.drops) && game.drops.length) {
    const now = Date.now();
    for (let i = game.drops.length - 1; i >= 0; i--) {
      const d = game.drops[i];
      d.vx *= 0.92; d.vy *= 0.92;
      d.x += d.vx; d.y += d.vy;
      if (collideWalls(d.x, d.y, d.r)) { d.x -= d.vx; d.y -= d.vy; d.vx = 0; d.vy = 0; }
      d.x = Math.max(d.r, Math.min(map.size.w - d.r, d.x));
      d.y = Math.max(d.r, Math.min(map.size.h - d.r, d.y));
      d.life -= 16 / 1000;
      const dd = Math.hypot(d.x - p.x, d.y - p.y);
      if (dd < p.r + d.r + 4 && p.hp > 0) {
        if (d.type === 'coins') {
          state.coins += d.amount;
          addKillFeed('💰 +' + d.amount + ' 金币');
          // 捡到金币就推一次主 KV（小额 5 秒节流在前端）
          syncCoinsToMain(false);
        } else if (d.type === 'hp') {
          p.hp = Math.min(getHpMax(), p.hp + (d.amount || 30));
          addKillFeed('💚 +' + (d.amount || 30) + ' HP');
        } else if (d.type === 'ammo') {
          if (p.reloading <= 0) p.ammo = Math.min(getWeaponAmmo(p.weapon), p.ammo + 6);
          addKillFeed('🔫 弹药 +6');
        }
        game.drops.splice(i, 1);
        continue;
      }
      if (d.life <= 0) game.drops.splice(i, 1);
    }
  }
  // 更新 HUD
  $('hpFill').style.width = Math.max(0, p.hp / getHpMax() * 100) + '%';
  $('hpText').textContent = Math.ceil(p.hp) + '/' + getHpMax();
  $('killCount').textContent = state.kills;
  // 检查玩家死亡
  if (p.hp <= 0 && !$('deathOverlay').classList.contains('show')) {
    $('deathOverlay').classList.remove('hidden');
    $('deathOverlay').classList.add('show');
    $('deathKills').textContent = state.kills;
    state.stats.games++;
    state.stats.totalKills += state.kills;
    if (state.kills > state.stats.bestKills) state.stats.bestKills = state.kills;
    // 经验
    state.level = Math.floor(1 + state.stats.totalKills / 10);
    // ===== 死亡惩罚：丢 15% 金币在地上（可捡回一部分）=====
    const lost = Math.min(200, Math.max(10, Math.floor(state.coins * 0.15)));
    if (lost > 0) {
      // ===== 数学修正：3 堆掉落总额必须 == lost（之前 ceil 累加会多 1~2 个，刷金币）=====
      const part = Math.floor(lost / 3);
      const remainder = lost - part * 3;
      for (let i = 0; i < 3; i++) {
        const amount = part + (i === 0 ? remainder : 0); // 余数补到第一堆
        if (amount > 0) {
          spawnDrop({
            type: 'coins', amount,
            x: p.x + rand(-30, 30), y: p.y + rand(-30, 30),
            owner: 'player', life: 60,
          });
        }
      }
      state.coins -= lost;
    }
    // 击杀奖励（保留部分）
    const reward = Math.floor(state.kills * 4);
    if (reward > 0) state.coins += reward;
    addKillFeed('💀 你挂了，损失 ' + lost + ' 金币（地上可捡回）');
    saveShootData(true); // 死亡时强制立即同步服务器
    syncCoinsToMain(true); // 死亡允许金币减少 → 写入主 player: KV
  }
  // WebSocket 位置广播（每 2 帧约 33ms 一次，超丝滑；payload 只发变化量）
  game._wsTick = (game._wsTick || 0) + 1;
  if (game.ws && game.ws.readyState === 1 && game._wsTick % 2 === 0) {
    try {
      const ang = Math.atan2(game.aim.y - p.y, game.aim.x - p.x);
      // 状态字段只在变化时附带（hp/weapon/ammo），其它时候只发位置+facing，省带宽
      const hpChanged = (game._lastSentHp !== Math.round(p.hp));
      const wpChanged = (game._lastSentWp !== p.weapon);
      const ammoChanged = (game._lastSentAmmo !== p.ammo);
      const msg = { type: 'pos', x: p.x, y: p.y, vx: p.vel.x, vy: p.vel.y, facing: ang, t: Date.now() };
      if (hpChanged) { msg.hp = p.hp; game._lastSentHp = Math.round(p.hp); }
      if (wpChanged) { msg.weapon = p.weapon; game._lastSentWp = p.weapon; }
      if (ammoChanged) { msg.ammo = p.ammo; game._lastSentAmmo = p.ammo; }
      // 每次必发一个 sequence 给接收端做插值
      game._wsSeq = (game._wsSeq || 0) + 1;
      msg.seq = game._wsSeq;
      game.ws.send(JSON.stringify(msg));
    } catch (e) {}
  }
}
function collideWalls(x, y, r) {
  for (const w of game.walls) {
    if (x + r > w.x && x - r < w.x + w.w && y + r > w.y && y - r < w.y + w.h) return true;
  }
  return false;
}
function fireBullet(x, y, angle, weapon, isPlayer) {
  const w = WEAPONS[weapon];
  const dmg = getWeaponDmg(weapon);
  const range = w.range;
  // 真人对战广播：本机玩家开火时通知其他人
  if (isPlayer && game.ws && game.ws.readyState === 1) sendShootWS(x, y, angle, weapon);
  if (weapon === 'shotgun') {
    for (let i = 0; i < 5; i++) {
      const a = angle + rand(-0.18, 0.18);
      game.bullets.push({
        x, y,
        vx: Math.cos(a) * 18,
        vy: Math.sin(a) * 18,
        dmg: dmg * 0.8,
        life: range / 18 * 16,
        knock: w.knockback * 0.5,
        isPlayerBullet: isPlayer,
        color: isPlayer ? '#ffd54f' : '#ff5252'
      });
    }
  } else {
    game.bullets.push({
      x, y,
      vx: Math.cos(angle) * 18,
      vy: Math.sin(angle) * 18,
      dmg,
      life: range / 18 * 16,
      knock: w.knockback,
      isPlayerBullet: isPlayer,
      color: isPlayer ? '#ffd54f' : '#ff5252'
    });
  }
}
function onKill(target, byPlayer) {
  if (byPlayer) {
    state.kills++;
    addKillFeed(`你 击杀了 ${target.name}`);
    // ===== 击杀掉落（走到跟前自动捡） =====
    const goldDrop = 8 + Math.floor((target.maxHp || getHpMax()) / 25);
    spawnDrop({ type: 'coins', amount: goldDrop, x: target.x + rand(-14, 14), y: target.y + rand(-14, 14), owner: 'enemy', life: 25 });
    const roll = Math.random();
    if (roll < 0.25) {
      spawnDrop({ type: 'hp', amount: 30, x: target.x + rand(-22, 22), y: target.y + rand(-22, 22), owner: 'enemy', life: 25, color: '#4caf50' });
    } else if (roll < 0.45) {
      spawnDrop({ type: 'ammo', amount: 0.5, x: target.x + rand(-22, 22), y: target.y + rand(-22, 22), owner: 'enemy', life: 25, color: '#ff9800' });
    }
    if (Math.random() < 0.15) {
      game.player.hp = Math.min(getHpMax(), game.player.hp + 20);
    }
  } else {
    addKillFeed(`${target.name} 被击杀`);
  }
  if (byPlayer) {
    // 重新生成 bot
    setTimeout(() => { if (game.running) spawnBot(); }, 2500);
  }
}
/** 生成一个掉落物 */
function spawnDrop(opts) {
  if (!Array.isArray(game.drops)) game.drops = [];
  game.drops.push(Object.assign({
    type: 'coins', amount: 10, x: 0, y: 0,
    vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4,
    r: 10, life: 30, owner: 'enemy', spawnTs: Date.now(),
  }, opts));
}
function addKillFeed(text) {
  const el = document.createElement('div');
  el.className = 'kf';
  el.textContent = text;
  $('killFeed').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}
function spawnDamage(x, y, dmg) {
  const sx = x - game.camera.x;
  const sy = y - game.camera.y;
  const el = document.createElement('div');
  el.className = 'dmg';
  el.style.left = sx + 'px';
  el.style.top = sy + 'px';
  el.textContent = '-' + Math.round(dmg);
  $('app').appendChild(el);
  setTimeout(() => el.remove(), 1000);
}
function aiUpdate(e) {
  const p = game.player;
  const dist = Math.hypot(p.x - e.x, p.y - e.y);
  const map = game.map;
  const w = WEAPONS[e.weapon];
  e.moveTimer -= 16;

  // ===== 看见玩家？用 FOV（眼睛范围）+ 视线判断 =====
  const seesPlayer = (dist < e.fovRange) && !lineBlocked(e.x, e.y, p.x, p.y);
  if (seesPlayer) e.lastSeenPlayerTs = Date.now();

  // ===== 状态机切换 =====
  if (e.hp <= e.retreatHp && e.ammo > 0) {
    e.state = 'RETREAT';
  } else if (e.ammo <= 0 || e.reloading > 0) {
    e.state = 'RELOAD';
  } else if (seesPlayer && dist < e.fireRange) {
    e.state = 'ATTACK';
  } else if (seesPlayer) {
    e.state = 'CHASE';
  } else {
    e.state = 'PATROL';
  }

  // ===== 装弹推进 =====
  if (e.reloading > 0) {
    e.reloading -= 16;
    if (e.reloading <= 0) { e.ammo = getWeaponAmmo(e.weapon); e.reloading = 0; }
  }
  if (e.ammo <= 0 && e.reloading <= 0) {
    e.reloading = w.reload;
  }

  // ===== 状态行为 =====
  let tx = e.targetX, ty = e.targetY;
  if (e.state === 'RETREAT') {
    const ang = Math.atan2(e.y - p.y, e.x - p.x);
    tx = e.x + Math.cos(ang) * 260;
    ty = e.y + Math.sin(ang) * 260;
  } else if (e.state === 'RELOAD') {
    const ang = Math.atan2(e.y - p.y, e.x - p.x);
    tx = e.x + Math.cos(ang) * 220;
    ty = e.y + Math.sin(ang) * 220;
    if (e.reloading <= 0 && e.ammo > 0) e.state = 'CHASE';
  } else if (e.state === 'ATTACK') {
    tx = e.x + Math.sin(Date.now() / 220) * 8;
    ty = e.y + Math.cos(Date.now() / 220) * 8;
  } else if (e.state === 'CHASE') {
    tx = p.x; ty = p.y;
  } else if (e.state === 'PATROL') {
    const dToWp = Math.hypot(tx - e.x, ty - e.y);
    if (dToWp < 28) {
      if (e.moveTimer <= 0) {
        const wps = map._waypoints;
        e.patrolIdx = (e.patrolIdx + 1) % wps.length;
        tx = wps[e.patrolIdx].x;
        ty = wps[e.patrolIdx].y;
        e.moveTimer = 1200 + Math.random() * 800;
      }
    }
  }

  // ===== 移动 =====
  const dx = tx - e.x;
  const dy = ty - e.y;
  const dl = Math.hypot(dx, dy);
  const speedMul = e.state === 'PATROL' ? 0.7 : 1.0;
  const spd = e.speed * speedMul;
  if (dl > 4) {
    const mx = dx / dl * spd;
    const my = dy / dl * spd;
    const nx = e.x + mx, ny = e.y + my;
    if (!collideWalls(nx, e.y, e.r)) e.x = nx;
    if (!collideWalls(e.x, ny, e.r)) e.y = ny;
    e.vel.x = mx; e.vel.y = my;
  } else {
    e.vel.x = 0; e.vel.y = 0;
  }
  e.x = Math.max(e.r, Math.min(map.size.w - e.r, e.x));
  e.y = Math.max(e.r, Math.min(map.size.h - e.r, e.y));
  e.targetX = tx; e.targetY = ty;

  // ===== 攻击 =====
  if ((e.state === 'ATTACK' || e.state === 'RETREAT' || e.state === 'CHASE') && seesPlayer && e.reloading <= 0) {
    e.lastFire -= 16;
    if (e.lastFire <= 0) {
      const ang = Math.atan2(p.y - e.y, p.x - e.x);
      fireBullet(e.x, e.y, ang, e.weapon, false);
      e.ammo--;
      e.lastFire = w.fireRate;
    }
  } else {
    e.lastFire = 0;
  }
}

/** 视线检测：被墙挡住返回 true */
function lineBlocked(ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len = Math.hypot(dx, dy);
  const steps = Math.ceil(len / 24);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const x = ax + dx * t, y = ay + dy * t;
    if (collideWalls(x, y, 2)) return true;
  }
  return false;
}

// ============== 地图绘制 ==============
function drawWall(ctx, wall) {
  const t = wall.type || 'wall';
  ctx.save();
  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.fillRect(wall.x + 3, wall.y + 3, wall.w, wall.h);
  if (t === 'stone') {
    // 石头掩体
    const g = ctx.createLinearGradient(wall.x, wall.y, wall.x, wall.y + wall.h);
    g.addColorStop(0, '#8a8a8a'); g.addColorStop(1, '#4a4a4a');
    ctx.fillStyle = g; ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
    ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 2; ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
    // 砖块纹理
    ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 1;
    for (let yy = 20; yy < wall.h; yy += 20) {
      ctx.beginPath(); ctx.moveTo(wall.x, wall.y + yy); ctx.lineTo(wall.x + wall.w, wall.y + yy); ctx.stroke();
    }
    for (let xx = 30; xx < wall.w; xx += 30) {
      ctx.beginPath(); ctx.moveTo(wall.x + xx, wall.y); ctx.lineTo(wall.x + xx, wall.y + wall.h); ctx.stroke();
    }
  } else if (t === 'wall') {
    // 木/砖墙
    const g = ctx.createLinearGradient(wall.x, wall.y, wall.x, wall.y + wall.h);
    g.addColorStop(0, '#a07050'); g.addColorStop(1, '#6a4a2a');
    ctx.fillStyle = g; ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
    ctx.strokeStyle = '#3a2a10'; ctx.lineWidth = 2; ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
    // 木纹
    ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 1;
    for (let yy = 8; yy < wall.h; yy += 8) {
      ctx.beginPath(); ctx.moveTo(wall.x, wall.y + yy); ctx.lineTo(wall.x + wall.w, wall.y + yy); ctx.stroke();
    }
  } else if (t === 'ice') {
    // 冰块
    const g = ctx.createLinearGradient(wall.x, wall.y, wall.x, wall.y + wall.h);
    g.addColorStop(0, '#d8eef5'); g.addColorStop(1, '#7ab8d8');
    ctx.fillStyle = g; ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
    ctx.strokeStyle = '#5a8aaa'; ctx.lineWidth = 2; ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
    // 冰裂
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(wall.x + wall.w * .3, wall.y); ctx.lineTo(wall.x + wall.w * .3, wall.y + wall.h);
    ctx.moveTo(wall.x + wall.w * .7, wall.y); ctx.lineTo(wall.x + wall.w * .7, wall.y + wall.h);
    ctx.stroke();
  } else if (t === 'building') {
    // 建筑
    const g = ctx.createLinearGradient(wall.x, wall.y, wall.x + wall.w, wall.y);
    g.addColorStop(0, '#6a6a72'); g.addColorStop(1, '#3a3a42');
    ctx.fillStyle = g; ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
    ctx.strokeStyle = '#1a1a22'; ctx.lineWidth = 2; ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
    // 窗户
    ctx.fillStyle = 'rgba(255,220,100,.7)';
    const cols = Math.max(1, Math.floor(wall.w / 25));
    const rows = Math.max(1, Math.floor(wall.h / 25));
    const winW = 8, winH = 10;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const wx = wall.x + (c + .5) * (wall.w / cols) - winW / 2;
        const wy = wall.y + (r + .5) * (wall.h / rows) - winH / 2;
        ctx.fillRect(wx, wy, winW, winH);
      }
    }
  } else if (t === 'crate-pile') {
    // 集装箱堆
    const g = ctx.createLinearGradient(wall.x, wall.y, wall.x, wall.y + wall.h);
    g.addColorStop(0, '#c08050'); g.addColorStop(1, '#805030');
    ctx.fillStyle = g; ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
    ctx.strokeStyle = '#3a2010'; ctx.lineWidth = 2; ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
    // 板条
    ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1;
    for (let xx = 12; xx < wall.w; xx += 12) {
      ctx.beginPath(); ctx.moveTo(wall.x + xx, wall.y); ctx.lineTo(wall.x + xx, wall.y + wall.h); ctx.stroke();
    }
    // 标签
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('📦', wall.x + wall.w / 2, wall.y + wall.h / 2 + 5);
  } else if (t === 'metal') {
    // 金属墙
    const g = ctx.createLinearGradient(wall.x, wall.y, wall.x, wall.y + wall.h);
    g.addColorStop(0, '#5a6a7a'); g.addColorStop(1, '#2a3a4a');
    ctx.fillStyle = g; ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
    ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 1; ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
    // 高光线
    ctx.strokeStyle = 'rgba(0,212,255,.4)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(wall.x + 2, wall.y + 2); ctx.lineTo(wall.x + wall.w - 2, wall.y + 2);
    ctx.moveTo(wall.x + 2, wall.y + wall.h - 2); ctx.lineTo(wall.x + wall.w - 2, wall.y + wall.h - 2);
    ctx.stroke();
  } else {
    // 默认
    ctx.fillStyle = '#5a3a1a'; ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
    ctx.strokeStyle = '#3a2a10'; ctx.lineWidth = 2; ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
  }
  ctx.restore();
}

function drawDecor(ctx, d) {
  ctx.save();
  const t = d.type;
  if (t === 'tree' || t === 'pine') {
    // 树
    const isPine = t === 'pine';
    const cx = d.x, cy = d.y;
    // 阴影
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.ellipse(cx + 4, cy + 30, 28, 8, 0, 0, Math.PI * 2); ctx.fill();
    // 树干
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(cx - 5, cy, 10, 25);
    // 树冠
    if (isPine) {
      ctx.fillStyle = '#1a4a1a';
      ctx.beginPath();
      ctx.moveTo(cx, cy - 35); ctx.lineTo(cx - 25, cy); ctx.lineTo(cx + 25, cy); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx, cy - 25); ctx.lineTo(cx - 30, cy + 5); ctx.lineTo(cx + 30, cy + 5); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx, cy - 15); ctx.lineTo(cx - 35, cy + 10); ctx.lineTo(cx + 35, cy + 10); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#0a2a0a'; ctx.lineWidth = 2;
      [0,1,2].forEach(i => {
        const yOff = [-35,-25,-15][i];
        ctx.beginPath();
        ctx.moveTo(cx, cy + yOff); ctx.lineTo(cx + (i==0?25:i==1?30:35), cy + (i==0?0:i==1?5:10));
        ctx.moveTo(cx, cy + yOff); ctx.lineTo(cx - (i==0?25:i==1?30:35), cy + (i==0?0:i==1?5:10));
        ctx.stroke();
      });
    } else {
      ctx.fillStyle = '#3a7a3a';
      ctx.beginPath(); ctx.arc(cx, cy, 25, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2a5a2a';
      ctx.beginPath(); ctx.arc(cx - 8, cy - 5, 12, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#1a3a1a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, 25, 0, Math.PI * 2); ctx.stroke();
    }
  } else if (t === 'barrel') {
    // 油桶
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.ellipse(d.x + 2, d.y + 22, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c04020';
    ctx.fillRect(d.x - 12, d.y - 18, 24, 40);
    ctx.fillStyle = '#a03010';
    ctx.fillRect(d.x - 12, d.y - 18, 24, 6);
    ctx.fillRect(d.x - 12, d.y + 16, 24, 6);
    ctx.strokeStyle = '#3a0a00'; ctx.lineWidth = 2;
    ctx.strokeRect(d.x - 12, d.y - 18, 24, 40);
    // 高光
    ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(d.x - 8, d.y - 15); ctx.lineTo(d.x - 8, d.y + 15); ctx.stroke();
  } else if (t === 'cactus') {
    // 仙人掌
    ctx.fillStyle = '#3a7a3a';
    ctx.fillRect(d.x - 6, d.y - 25, 12, 50);
    ctx.fillRect(d.x - 18, d.y - 15, 12, 25);
    ctx.fillRect(d.x + 6, d.y - 18, 12, 28);
    ctx.strokeStyle = '#1a4a1a'; ctx.lineWidth = 2;
    ctx.strokeRect(d.x - 6, d.y - 25, 12, 50);
    ctx.strokeRect(d.x - 18, d.y - 15, 12, 25);
    ctx.strokeRect(d.x + 6, d.y - 18, 12, 28);
  } else if (t === 'rock') {
    // 岩石
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.ellipse(d.x + 3, d.y + 12, 18, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8a8a8a';
    ctx.beginPath();
    ctx.moveTo(d.x - 20, d.y + 10); ctx.lineTo(d.x - 15, d.y - 5);
    ctx.lineTo(d.x, d.y - 15); ctx.lineTo(d.x + 15, d.y - 8);
    ctx.lineTo(d.x + 22, d.y + 5); ctx.lineTo(d.x + 18, d.y + 12);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.2)';
    ctx.beginPath(); ctx.moveTo(d.x - 8, d.y - 5); ctx.lineTo(d.x - 5, d.y - 12);
    ctx.lineTo(d.x + 5, d.y - 10); ctx.lineTo(d.x + 2, d.y - 5); ctx.closePath(); ctx.fill();
  } else if (t === 'crate') {
    // 板条箱
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.fillRect(d.x - 17, d.y - 12, 36, 30);
    ctx.fillStyle = '#b07040';
    ctx.fillRect(d.x - 18, d.y - 15, 36, 30);
    ctx.strokeStyle = '#3a2010'; ctx.lineWidth = 2; ctx.strokeRect(d.x - 18, d.y - 15, 36, 30);
    ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1;
    for (let i = -10; i <= 10; i += 7) {
      ctx.beginPath(); ctx.moveTo(d.x + i, d.y - 15); ctx.lineTo(d.x + i, d.y + 15); ctx.stroke();
    }
  } else if (t === 'bush') {
    // 草丛
    ctx.fillStyle = '#2a5a2a';
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.arc(d.x + (i - 2) * 7, d.y + (i % 2) * 3, 8, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (t === 'torch') {
    // 火把
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(d.x - 2, d.y, 4, 20);
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(d.x - 4, d.y - 3, 8, 6);
    // 火焰
    const flick = Math.sin(Date.now() / 80 + d.x) * 2;
    ctx.fillStyle = '#ffaa00';
    ctx.beginPath();
    ctx.moveTo(d.x, d.y - 18 + flick); ctx.quadraticCurveTo(d.x - 6, d.y - 10, d.x, d.y - 3);
    ctx.quadraticCurveTo(d.x + 6, d.y - 10, d.x, d.y - 18 + flick);
    ctx.fill();
    ctx.fillStyle = '#ff5500';
    ctx.beginPath();
    ctx.moveTo(d.x, d.y - 12 + flick); ctx.quadraticCurveTo(d.x - 3, d.y - 7, d.x, d.y - 3);
    ctx.quadraticCurveTo(d.x + 3, d.y - 7, d.x, d.y - 12 + flick);
    ctx.fill();
  } else if (t === 'snowman') {
    // 雪人
    ctx.fillStyle = '#fafafa';
    ctx.beginPath(); ctx.arc(d.x, d.y, 18, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(d.x, d.y - 22, 13, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(d.x, d.y - 38, 9, 0, Math.PI * 2); ctx.fill();
    // 眼睛
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(d.x - 3, d.y - 40, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(d.x + 3, d.y - 40, 1.5, 0, Math.PI * 2); ctx.fill();
    // 鼻子
    ctx.fillStyle = '#ff8800';
    ctx.beginPath(); ctx.moveTo(d.x, d.y - 38); ctx.lineTo(d.x + 6, d.y - 37); ctx.lineTo(d.x, d.y - 36); ctx.closePath(); ctx.fill();
    // 帽子
    ctx.fillStyle = '#222';
    ctx.fillRect(d.x - 9, d.y - 50, 18, 4);
    ctx.fillRect(d.x - 6, d.y - 56, 12, 8);
  } else if (t === 'car') {
    // 车辆
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(d.x + 3, d.y + 18, 38, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#aa3030';
    ctx.fillRect(d.x - 35, d.y - 5, 70, 18);
    ctx.fillStyle = '#cc4040';
    ctx.beginPath();
    ctx.moveTo(d.x - 30, d.y - 5); ctx.lineTo(d.x - 22, d.y - 18);
    ctx.lineTo(d.x + 22, d.y - 18); ctx.lineTo(d.x + 30, d.y - 5);
    ctx.closePath(); ctx.fill();
    // 窗户
    ctx.fillStyle = '#6ab0d0';
    ctx.fillRect(d.x - 25, d.y - 15, 18, 10);
    ctx.fillRect(d.x + 7, d.y - 15, 18, 10);
    // 车轮
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(d.x - 22, d.y + 13, 7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(d.x + 22, d.y + 13, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#888';
    ctx.beginPath(); ctx.arc(d.x - 22, d.y + 13, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(d.x + 22, d.y + 13, 3, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'cone') {
    // 路障
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.ellipse(d.x + 1, d.y + 14, 10, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff6600';
    ctx.beginPath();
    ctx.moveTo(d.x, d.y - 14); ctx.lineTo(d.x - 8, d.y + 14); ctx.lineTo(d.x + 8, d.y + 14);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(d.x - 7, d.y + 3, 14, 3);
  } else if (t === 'boat') {
    // 船
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(d.x + 2, d.y + 22, 50, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5a3a1a';
    ctx.beginPath();
    ctx.moveTo(d.x - 45, d.y); ctx.lineTo(d.x - 35, d.y + 18); ctx.lineTo(d.x + 35, d.y + 18); ctx.lineTo(d.x + 45, d.y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(d.x - 5, d.y - 30, 10, 30);
    ctx.fillStyle = '#cc4040';
    ctx.beginPath();
    ctx.moveTo(d.x + 5, d.y - 28); ctx.lineTo(d.x + 35, d.y - 5); ctx.lineTo(d.x + 5, d.y);
    ctx.closePath(); ctx.fill();
  } else if (t === 'rope') {
    // 缆绳
    ctx.strokeStyle = '#8a5a30'; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    for (let i = 0; i < 5; i++) {
      ctx.lineTo(d.x + (i % 2 === 0 ? 8 : -8), d.y + i * 8);
    }
    ctx.stroke();
  } else if (t === 'mushroom') {
    // 蘑菇
    ctx.fillStyle = '#fff';
    ctx.fillRect(d.x - 4, d.y - 5, 8, 18);
    ctx.beginPath(); ctx.arc(d.x, d.y - 5, 16, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#cc3030';
    ctx.beginPath(); ctx.arc(d.x, d.y - 5, 16, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(d.x - 6, d.y - 8, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(d.x + 5, d.y - 12, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(d.x + 7, d.y - 5, 2.5, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'console') {
    // 控制台
    ctx.fillStyle = 'rgba(0,212,255,.2)';
    ctx.fillRect(d.x - 22, d.y - 18, 44, 36);
    ctx.fillStyle = '#2a3a4a';
    ctx.fillRect(d.x - 20, d.y - 16, 40, 32);
    ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 1; ctx.strokeRect(d.x - 20, d.y - 16, 40, 32);
    // 屏幕
    ctx.fillStyle = '#00d4ff';
    ctx.fillRect(d.x - 15, d.y - 12, 30, 14);
    // 按钮
    ctx.fillStyle = '#ff3333';
    ctx.beginPath(); ctx.arc(d.x - 10, d.y + 8, 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffaa00';
    ctx.beginPath(); ctx.arc(d.x, d.y + 8, 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#33ff33';
    ctx.beginPath(); ctx.arc(d.x + 10, d.y + 8, 2, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'pod') {
    // 逃生舱
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(d.x + 2, d.y + 22, 18, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5a6a7a';
    ctx.beginPath(); ctx.ellipse(d.x, d.y, 18, 22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#00d4ff';
    ctx.beginPath(); ctx.arc(d.x, d.y - 5, 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2a3a4a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(d.x, d.y, 18, 22, 0, 0, Math.PI * 2); ctx.stroke();
  } else if (t === 'star') {
    // 星星（闪烁）
    const flick = Math.sin(Date.now() / 200 + d.x) * .3 + .7;
    ctx.fillStyle = `rgba(255,255,255,${flick})`;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
      const x = d.x + Math.cos(a) * 5;
      const y = d.y + Math.sin(a) * 5;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      const a2 = a + Math.PI / 5;
      const x2 = d.x + Math.cos(a2) * 2;
      const y2 = d.y + Math.sin(a2) * 2;
      ctx.lineTo(x2, y2);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function render() {
  // ===== 帧率 + WS RTT 统计（每 500ms 更新一次到 HUD）=====
  const _now = performance.now();
  game._fpsFrames = (game._fpsFrames || 0) + 1;
  if (!game._fpsLast || _now - game._fpsLast >= 500) {
    const fps = Math.round((game._fpsFrames * 1000) / (_now - game._fpsLast));
    const fEl = $('fpsVal'); if (fEl) fEl.textContent = String(fps);
    game._fpsFrames = 0; game._fpsLast = _now;
    if (Array.isArray(game._rtts) && game._rtts.length) {
      const sorted = game._rtts.slice().sort((a, b) => a - b);
      const med = sorted[Math.floor(sorted.length / 2)] || 0;
      const rEl = $('rttVal'); if (rEl) rEl.textContent = String(med);
      const badge = $('perfBadge');
      if (badge) badge.style.color = med > 200 ? '#ff5252' : (med > 100 ? '#ffd54f' : '#4caf50');
    }
  }
  const ctx = game.ctx;
  const w = game.w, h = game.h;
  ctx.save();
  // 主题背景渐变
  const map = game.map;
  const theme = map.theme || {sky: map.bg, ground: map.bg};
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, theme.sky);
  grad.addColorStop(1, theme.ground);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
  ctx.translate(-game.camera.x, -game.camera.y);
  // 网格
  ctx.strokeStyle = map.gridColor || 'rgba(255,255,255,.05)';
  ctx.lineWidth = 1;
  for (let x = 0; x < map.size.w; x += 80) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, map.size.h); ctx.stroke();
  }
  for (let y = 0; y < map.size.h; y += 80) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(map.size.w, y); ctx.stroke();
  }
  // 边界墙
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.fillRect(0, 0, map.size.w, 4);
  ctx.fillRect(0, map.size.h - 4, map.size.w, 4);
  ctx.fillRect(0, 0, 4, map.size.h);
  ctx.fillRect(map.size.w - 4, 0, 4, map.size.h);
  // 装饰物（先画掩体前的物件）
  if (map.decor) {
    for (const d of map.decor) drawDecor(ctx, d);
  }
  // 掩体/墙（按类型画）
  for (const wall of game.walls) drawWall(ctx, wall);
  // 名字/HP 等后续
  // 子弹
  for (const b of game.bullets) {
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
    ctx.fill();
    // 拖尾
    ctx.strokeStyle = b.color + '88';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 2, b.y - b.vy * 2);
    ctx.stroke();
  }
  // 远端子弹（别人发射）
  if (game.remoteBullets) {
    for (const b of game.remoteBullets) {
      ctx.fillStyle = '#ff7043';
      ctx.beginPath();
      ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // 其他真人玩家：用历史缓冲做时间戳线性插值（消除网络抖动），并平滑朝向
  if (game.otherPlayers && game.otherPlayers.size) {
    const now = Date.now();
    for (const op of game.otherPlayers.values()) {
      let ox = op.x, oy = op.y;
      let ofx = op.facing || 0;
      // 用缓冲里的两帧做线性插值（renderTime = now - interpDelay）
      // interpDelay ≈ 网络半程延迟，让画面稍微"追上"实时
      if (op._buf && op._buf.length >= 2) {
        const buf = op._buf;
        const interpDelay = 80; // ms，按 RTT 中位数自适应也行；先用固定 80ms
        const targetT = now - interpDelay;
        // 找到 targetT 落在哪两帧之间
        let a = buf[0], b = buf[buf.length - 1];
        for (let i = buf.length - 1; i >= 0; i--) {
          if (buf[i].t <= targetT) { a = buf[i]; b = buf[i + 1] || buf[i]; break; }
        }
        if (b && b !== a) {
          const span = b.t - a.t;
          const u = span > 0 ? Math.min(1, Math.max(0, (targetT - a.t) / span)) : 0;
          ox = a.x + (b.x - a.x) * u;
          oy = a.y + (b.y - a.y) * u;
          // 朝向：处理角度环绕
          let dfx = b.facing - a.facing;
          if (dfx > Math.PI) dfx -= Math.PI * 2;
          if (dfx < -Math.PI) dfx += Math.PI * 2;
          ofx = a.facing + dfx * u;
        } else if (b) {
          ox = b.x; oy = b.y; ofx = b.facing;
        }
        // 超过 1 秒没新包 → 用最后速度推算，避免突然停下
        if (now - b.t > 1000) {
          const dt2 = Math.min(0.3, (now - b.t) / 1000);
          ox = b.x + (b.vx || 0) * dt2;
          oy = b.y + (b.vy || 0) * dt2;
        }
      } else if (op._buf && op._buf.length === 1) {
        // 只有一帧缓冲：用 vx/vy 推算
        const dt = Math.min(0.3, (now - (op.lastTs || now)) / 1000);
        ox = op.x + (op.vx || 0) * dt;
        oy = op.y + (op.vy || 0) * dt;
      } else {
        // 无缓冲（首帧之前）→ 旧的线性外推
        const dt = Math.min(0.3, (now - (op.lastTs || now)) / 1000);
        ox = op.x + (op.vx || 0) * dt;
        oy = op.y + (op.vy || 0) * dt;
      }
      ctx.fillStyle = op.color;
      ctx.beginPath();
      ctx.arc(ox, oy, op.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.stroke();
      // 枪口方向
      ctx.strokeStyle = '#5a3a1a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(ox, oy);
      ctx.lineTo(ox + Math.cos(ofx) * (op.r + 8), oy + Math.sin(ofx) * (op.r + 8));
      ctx.stroke();
      // 血条
      const hpw = 36;
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.fillRect(ox - hpw / 2, oy - op.r - 12, hpw, 5);
      ctx.fillStyle = '#ff5252';
      ctx.fillRect(ox - hpw / 2, oy - op.r - 12, hpw * Math.max(0, op.hp / getHpMax()), 5);
      // 名字
      ctx.fillStyle = '#fff';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(op.nickname || op.username, ox, oy - op.r - 16);
    }
  }
  // 玩家
  const p = game.player;
  if (p.hp > 0) {
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.stroke();
    // 枪口方向
    const ang = Math.atan2(game.aim.y - p.y, game.aim.x - p.x);
    ctx.strokeStyle = '#5a3a1a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + Math.cos(ang) * (p.r + 8), p.y + Math.sin(ang) * (p.r + 8));
    ctx.stroke();
    // 血条
    const hpw = 36;
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(p.x - hpw / 2, p.y - p.r - 12, hpw, 5);
    ctx.fillStyle = '#ff5252';
    ctx.fillRect(p.x - hpw / 2, p.y - p.r - 12, hpw * Math.max(0, p.hp / getHpMax()), 5);
    // 名字
    ctx.fillStyle = '#fff';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.name, p.x, p.y - p.r - 16);
    // 装弹条
    if (p.reloading > 0) {
      const w = WEAPONS[p.weapon].reload;
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.fillRect(p.x - 20, p.y + p.r + 4, 40, 4);
      ctx.fillStyle = '#4fc3f7';
      ctx.fillRect(p.x - 20, p.y + p.r + 4, 40 * (1 - p.reloading / w), 4);
    }
  }
  // 敌人
  for (const e of game.enemies) {
    if (e.hp <= 0) continue;
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.stroke();
    // 名字 + 血条
    const hpw = 36;
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(e.x - hpw / 2, e.y - e.r - 12, hpw, 5);
    ctx.fillStyle = '#ff5252';
    ctx.fillRect(e.x - hpw / 2, e.y - e.r - 12, hpw * Math.max(0, e.hp / getHpMax()), 5);
    ctx.fillStyle = '#fff';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(e.name, e.x, e.y - e.r - 16);
  }
  ctx.restore();
  // 准星
  ctx.strokeStyle = 'rgba(255,255,255,.7)';
  ctx.lineWidth = 2;
  const cx = game.aim.x - game.camera.x;
  const cy = game.aim.y - game.camera.y;
  ctx.beginPath();
  ctx.arc(cx, cy, 14, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - 20, cy); ctx.lineTo(cx - 8, cy);
  ctx.moveTo(cx + 8, cy); ctx.lineTo(cx + 20, cy);
  ctx.moveTo(cx, cy - 20); ctx.lineTo(cx, cy - 8);
  ctx.moveTo(cx, cy + 8); ctx.lineTo(cx, cy + 20);
  ctx.stroke();
  // 弹药显示
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.fillRect(game.w - 130, game.h - 90, 120, 40);
  ctx.fillStyle = '#ffd54f';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(`🔫 ${game.player.ammo}`, game.w - 20, game.h - 60);
  if (game.player.reloading > 0) {
    ctx.fillStyle = '#4fc3f7';
    ctx.font = '12px sans-serif';
    ctx.fillText('换弹中…', game.w - 20, game.h - 44);
  }
}

// ============== 输入控制 ==============
window.addEventListener('keydown', e => {
  game.keys[e.key.toLowerCase()] = true;
  if (e.key === 'r' || e.key === 'R') {
    if (game.player && game.player.reloading <= 0 && game.player.ammo < getWeaponAmmo(game.player.weapon)) {
      game.player.reloading = WEAPONS[game.player.weapon].reload;
    }
  }
});
window.addEventListener('keyup', e => { game.keys[e.key.toLowerCase()] = false; });

// 摇杆
(function initJoystick() {
  const stick = $('stick');
  let rect = null;
  let origin = { x: 0, y: 0 };
  let pid = null;
  function getRect() { return $('joystick').getBoundingClientRect(); }
  function onStart(id, x, y) {
    pid = id; rect = getRect();
    origin.x = rect.left + rect.width / 2;
    origin.y = rect.top + rect.height / 2;
    game.joystick.active = true;
  }
  function onMove(id, x, y) {
    if (id !== pid) return;
    const dx = x - origin.x, dy = y - origin.y;
    const max = 50;
    const len = Math.min(max, Math.hypot(dx, dy));
    const ang = Math.atan2(dy, dx);
    const sx = Math.cos(ang) * len, sy = Math.sin(ang) * len;
    stick.style.left = (35 + sx) + 'px';
    stick.style.top = (35 + sy) + 'px';
    game.joystick.dx = sx / max;
    game.joystick.dy = sy / max;
  }
  function onEnd(id) {
    if (id !== pid) return;
    pid = null;
    stick.style.left = '35px'; stick.style.top = '35px';
    game.joystick.active = false;
    game.joystick.dx = 0; game.joystick.dy = 0;
  }
  $('joystick').addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    onStart(t.identifier, t.clientX, t.clientY);
  }, { passive: false });
  $('joystick').addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) onMove(t.identifier, t.clientX, t.clientY);
  }, { passive: false });
  $('joystick').addEventListener('touchend', e => {
    for (const t of e.changedTouches) onEnd(t.identifier);
  });
  $('joystick').addEventListener('mousedown', e => {
    onStart('m', e.clientX, e.clientY);
    const mm = ev => onMove('m', ev.clientX, ev.clientY);
    const mu = () => { onEnd('m'); window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu); };
    window.addEventListener('mousemove', mm);
    window.addEventListener('mouseup', mu);
  });
})();

// 射击按钮
function tryFire() {
  const p = game.player;
  if (!p || p.hp <= 0) return;
  if (p.reloading > 0 || p.ammo <= 0) return;
  const now = Date.now();
  if (now - game.lastFire < WEAPONS[p.weapon].fireRate) return;
  game.lastFire = now;
  const ang = Math.atan2(game.aim.y - p.y, game.aim.x - p.x);
  fireBullet(p.x + Math.cos(ang) * (p.r + 4), p.y + Math.sin(ang) * (p.r + 4), ang, p.weapon, true);
  p.ammo--;
  // 屏幕震动
  shake(4, 100);
}
$('fireBtn').addEventListener('touchstart', e => { e.preventDefault(); game.autoFire = true; tryFire(); });
$('fireBtn').addEventListener('touchend', e => { e.preventDefault(); game.autoFire = false; });
$('fireBtn').addEventListener('mousedown', e => { game.autoFire = true; tryFire(); });
$('fireBtn').addEventListener('mouseup', () => { game.autoFire = false; });
$('fireBtn').addEventListener('mouseleave', () => { game.autoFire = false; });
$('reloadBtn').addEventListener('click', () => {
  if (game.player && game.player.reloading <= 0 && game.player.ammo < getWeaponAmmo(game.player.weapon)) {
    game.player.reloading = WEAPONS[game.player.weapon].reload;
  }
});
// 自动连发
setInterval(() => { if (game.autoFire) tryFire(); }, 50);

// 鼠标 / 触摸瞄准
$('game').addEventListener('mousemove', e => {
  const rect = $('game').getBoundingClientRect();
  game.aim.x = (e.clientX - rect.left) + game.camera.x;
  game.aim.y = (e.clientY - rect.top) + game.camera.y;
});
$('game').addEventListener('touchstart', e => {
  e.preventDefault();
  const rect = $('game').getBoundingClientRect();
  const t = e.changedTouches[0];
  game.aim.x = (t.clientX - rect.left) + game.camera.x;
  game.aim.y = (t.clientY - rect.top) + game.camera.y;
}, { passive: false });
$('game').addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = $('game').getBoundingClientRect();
  const t = e.changedTouches[0];
  game.aim.x = (t.clientX - rect.left) + game.camera.x;
  game.aim.y = (t.clientY - rect.top) + game.camera.y;
}, { passive: false });
$('game').addEventListener('click', e => {
  if (e.target.id === 'fireBtn' || e.target.id === 'reloadBtn' || e.target.closest('#joystick')) return;
  const rect = $('game').getBoundingClientRect();
  game.aim.x = (e.clientX - rect.left) + game.camera.x;
  game.aim.y = (e.clientY - rect.top) + game.camera.y;
  tryFire();
});

// 屏幕震动
let shakeX = 0, shakeY = 0, shakeTime = 0;
function shake(intensity, duration) {
  shakeTime = Math.max(shakeTime, duration);
  const interval = setInterval(() => {
    shakeX = (Math.random() - 0.5) * intensity;
    shakeY = (Math.random() - 0.5) * intensity;
    $('game').style.transform = `translate(${shakeX}px, ${shakeY}px)`;
    shakeTime -= 16;
    if (shakeTime <= 0) { clearInterval(interval); $('game').style.transform = ''; }
  }, 16);
}

// ============== 启动 ==============
async function initShootApp() {
  try {
    // 1. 读取 token
    try {
      const tok = localStorage.getItem('catworld.token') || localStorage.getItem('cat-world-token') || '';
      console.log('[shoot] token from localStorage:', tok ? tok.substring(0, 8) + '...' : 'null');
      if (tok) {
        state.token = tok;
        apiHeaders['authorization'] = 'Bearer ' + tok;
      }
    } catch(e) { console.warn('token read err', e); }

    // 2. 验证登录态（未登录也算正常状态，不阻断启动）
    try {
      const r = await fetch('/me', { headers: apiHeaders, credentials: 'include' });
      const j = await r.json();
      if (j && j.user) {
        state.loggedIn = true;
        state.nickname = j.user.nickname || j.user.username || '';
        state.username = j.user.username || '';
        console.log('[shoot] logged in as:', state.nickname, '/', state.username);
      } else {
        state.loggedIn = false;
        console.warn('[shoot] not logged in, /me returned:', j);
      }
    } catch(e) {
      state.loggedIn = false;
      console.warn('[shoot] /me failed', e);
    }
    updateLoginBadge();

    // 3. 加载数据（失败不阻断）
    try { await loadShootData(); } catch(e) { console.warn('[shoot] loadShootData err', e); }

    // 4. 启动心跳（失败不阻断）
    try { startHeartbeat(); } catch(e) { console.warn('[shoot] heartbeat err', e); }
  } catch(e) {
    console.error('[shoot] init err', e);
  } finally {
    // 5. 无论如何都隐藏 loading 并显示主菜单，避免遮罩卡死关不掉
    const ld = $('loading');
    if (ld) ld.classList.add('hidden');
    try { showMainMenu(); } catch(e) { console.error('[shoot] showMainMenu err', e); }
  }
}
initShootApp();

// ===== 防清空护栏：离开/隐藏页面时的保存 ——
function _safeExitSave() {
  // 仅在 _loaded=true 时才推服务端（避免初始空数据覆盖云端）
  if (state._loaded) {
    saveShootData(true);
    // 同步最后状态的金币到主 KV（即使 shoot-save 被节流，金币也会落盘）
    syncCoinsToMain(true); // 离开页面允许金币减少（如死亡掉落未复活）
  } else { console.warn('[shoot] beforeunload skip: not loaded'); }
}
window.addEventListener('beforeunload', _safeExitSave);
window.addEventListener('pagehide', _safeExitSave);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') _safeExitSave();
});
