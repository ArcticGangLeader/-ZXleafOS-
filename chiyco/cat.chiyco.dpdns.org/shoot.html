<head>
<meta charset="UTF-8">

<title>🐱 猫咪枪战 - 跑图射击</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
  #app{position:relative;width:100%;height:100%}

  /* 顶部 HUD */
  #hud{position:absolute;top:0;left:0;right:0;height:48px;background:linear-gradient(180deg,rgba(0,0,0,.7),rgba(0,0,0,.3));display:flex;align-items:center;padding:0 12px;gap:10px;z-index:30;font-size:13px}
  #hud .lbl{opacity:.7;margin-right:2px}
  #hud .val{color:#ffd54f;font-weight:700}
  #hud .back{background:rgba(255,255,255,.15);border-radius:6px;padding:4px 10px;font-size:12px}
  #hud .hpbar{flex:1;height:12px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden;position:relative;min-width:80px}
  #hud .hpbar .hpfill{position:absolute;top:0;left:0;bottom:0;background:linear-gradient(90deg,#ff5252,#ff8a65);transition:width .2s}
  #hud .hpbar .hptext{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;text-shadow:0 0 3px #000}

  /* 底部武器栏 */
  #weaponBar{position:absolute;bottom:0;left:0;right:0;height:72px;background:linear-gradient(0deg,rgba(0,0,0,.8),rgba(0,0,0,.3));display:flex;align-items:center;padding:6px 8px;gap:8px;z-index:30}
  #weaponBar .slot{flex:1;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);border-radius:8px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:54px}
  #weaponBar .slot.active{border-color:#ffd54f;background:rgba(255,213,79,.15);box-shadow:0 0 8px rgba(255,213,79,.4)}
  #weaponBar .slot .icon{font-size:22px}
  #weaponBar .slot .name{font-size:10px;margin-top:2px;opacity:.9}
  #weaponBar .slot .ammo{font-size:10px;color:#ffd54f}
  #weaponBar .slot.locked{opacity:.5}

  /* 摇杆 / 移动控制 */
  #joystick{position:absolute;left:20px;bottom:90px;width:120px;height:120px;z-index:25}
  #joystick .base{position:absolute;inset:0;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);border-radius:50%}
  #joystick .stick{position:absolute;width:50px;height:50px;left:35px;top:35px;background:rgba(255,213,79,.5);border:2px solid #ffd54f;border-radius:50%;transition:none}

  /* 射击按钮 */
  #fireBtn{position:absolute;right:20px;bottom:90px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,#ff5252,#b71c1c);border:3px solid #fff;font-size:14px;font-weight:700;z-index:25;box-shadow:0 0 15px rgba(255,82,82,.6)}
  #fireBtn:active{transform:scale(.92)}
  #reloadBtn{position:absolute;right:110px;bottom:100px;width:60px;height:60px;border-radius:50%;background:rgba(33,150,243,.7);border:2px solid #fff;font-size:12px;z-index:25}
  #reloadBtn:active{transform:scale(.92)}

  /* 击杀提示 */
  #killFeed{position:absolute;top:60px;right:10px;z-index:25;font-size:12px;display:flex;flex-direction:column;gap:4px;max-width:60%;pointer-events:none}
  #killFeed .kf{background:rgba(0,0,0,.5);padding:4px 8px;border-radius:4px;animation:fadeOut 4s forwards}
  @keyframes fadeOut{0%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateX(20px)}}

  /* 弹窗 */
  .modal{position:absolute;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal.hidden{display:none}
  .modal-box{background:#1e1e3a;border:2px solid #ffd54f;border-radius:12px;width:100%;max-width:560px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column}
  .modal-header{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between}
  .modal-header h2{font-size:18px;color:#ffd54f}
  .modal-header .close{font-size:24px;color:#aaa;padding:0 4px}
  .modal-body{padding:16px 18px;overflow-y:auto;flex:1}
  .modal-footer{padding:12px 18px;border-top:1px solid rgba(255,255,255,.1);display:flex;gap:8px;justify-content:flex-end}

  /* 地图卡片 */
  .map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
  .map-card{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.15);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .2s;position:relative}
  .map-card:hover{border-color:#ffd54f;transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,213,79,.2)}
  .map-card.selected{border-color:#ffd54f;box-shadow:0 0 16px rgba(255,213,79,.4)}
  .map-card .preview{width:100%;height:90px;position:relative;overflow:hidden}
  .map-card .map-emoji{position:absolute;bottom:4px;right:6px;font-size:22px;opacity:.7;pointer-events:none;text-shadow:0 0 6px rgba(0,0,0,.6)}
  .map-card .info{padding:8px 10px}
  .map-card .info .name{font-size:14px;font-weight:700;margin-bottom:4px}
  .map-card .info .meta{font-size:11px;opacity:.75;display:flex;gap:6px;flex-wrap:wrap}
  .map-card .info .meta span{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:3px}

  /* 武器卡片 */
  .weapon-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
  .weapon-card{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.15);border-radius:8px;padding:10px;cursor:pointer;transition:all .2s}
  .weapon-card:hover{border-color:#ffd54f}
  .weapon-card.selected{border-color:#ffd54f;background:rgba(255,213,79,.1)}
  .weapon-card .icon{font-size:32px;text-align:center;margin-bottom:6px}
  .weapon-card .name{font-size:13px;font-weight:700;text-align:center;margin-bottom:4px}
  .weapon-card .stats{font-size:10px;opacity:.7;display:flex;flex-direction:column;gap:2px}
  .weapon-card .price{text-align:center;margin-top:6px;color:#ffd54f;font-weight:700;font-size:13px}
  .weapon-card .upgrade{text-align:center;margin-top:4px;font-size:10px;color:#4fc3f7}

  /* 通用按钮 */
  .btn{padding:8px 16px;border-radius:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-size:13px;cursor:pointer;transition:all .15s}
  .btn:hover{background:rgba(255,255,255,.2)}
  .btn.primary{background:#ffd54f;color:#1a1a2e;border-color:#ffd54f;font-weight:700}
  .btn.primary:hover{background:#ffeb3b}
  .btn.danger{background:#ff5252;border-color:#ff5252}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* 主菜单 */
  #mainMenu{position:absolute;inset:0;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:40}
  #mainMenu h1{font-size:32px;margin-bottom:8px;color:#ffd54f;text-shadow:0 0 20px rgba(255,213,79,.5)}
  #mainMenu .sub{font-size:14px;opacity:.7;margin-bottom:30px}
  #mainMenu .menu-btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:280px}
  #mainMenu .menu-btns .btn{width:100%;padding:14px;font-size:16px}

  /* 在线状态指示 */
  .online-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4caf50;margin-right:4px;box-shadow:0 0 6px #4caf50}

  /* 死亡遮罩 */
  #deathOverlay{position:absolute;inset:0;background:rgba(180,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:35}
  #deathOverlay.hidden{display:none}
  #deathOverlay h2{font-size:36px;margin-bottom:8px}
  #deathOverlay p{font-size:16px;margin-bottom:20px}

  /* 伤害数字 */
  .dmg{position:absolute;color:#ffeb3b;font-weight:700;font-size:18px;pointer-events:none;z-index:20;animation:floatUp 1s forwards}
  @keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}

  /* 加载提示 */
  #loading{position:absolute;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:60;font-size:18px}
  #loading.hidden{display:none}

  /* 页面内轻量提示（替代 alert，遮罩式，点击背景即可关闭，不会卡死） */
  #tip{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .2s;pointer-events:none}
  #tip.show{opacity:1;pointer-events:auto}
  #tip .tip-box{background:rgba(30,30,58,.96);border:2px solid #ffd54f;border-radius:12px;padding:18px 24px;max-width:80%;text-align:center;font-size:14px;line-height:1.5;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  #tip .tip-btn{margin-top:12px;padding:7px 18px;background:#ffd54f;color:#1a1a2e;border-radius:6px;font-weight:700}
</style>
</head>
<body>
<div id="app">

  <!-- 加载层 -->
  <div id="loading">加载中…</div>

  <!-- 主菜单 -->
  <div id="mainMenu" style="display:none">
    <h1>🐱 猫咪枪战</h1>
    <div class="sub">跑图射击 · 多人对战</div>
    <div id="loginBadge" style="margin-bottom:14px;padding:6px 12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:6px;font-size:12px">🔴 未登录</div>
    <div class="menu-btns">
      <button class="btn primary" onclick="openMapSelect()">🎮 开始游戏</button>
      <button class="btn" onclick="openShop()">🛒 武器商店</button>
      <button class="btn" onclick="showStats()">📊 我的数据</button>
      <button class="btn" onclick="manualSync()">☁️ 手动同步</button>
      <button class="btn" onclick="backToWorld()">↩️ 返回主世界</button>
    </div>
    <div style="margin-top:20px;font-size:12px;opacity:.6">
      <span class="online-dot"></span><span id="onlineCount">--</span> 人在线
    </div>
  </div>

  <!-- 地图选择弹窗 -->
  <div id="mapModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2>🗺️ 选择地图</h2>
        <button class="close" onclick="closeMapModal()">×</button>
      </div>
      <div class="modal-body">
        <div style="margin-bottom:10px;padding:8px 12px;background:rgba(76,175,80,.15);border:1px solid #4caf50;border-radius:6px;font-size:12px">
          <span class="online-dot"></span>当前 <b id="modalOnlineCount">0</b> 人在线
        </div>
        <div style="margin-bottom:10px;font-size:13px;opacity:.8">选择初始武器：</div>
        <div id="weaponSelect" class="weapon-grid" style="margin-bottom:14px"></div>
        <div style="margin-bottom:8px;font-size:13px;opacity:.8">选择地图：</div>
        <div id="mapList" class="map-grid"></div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeMapModal()">取消</button>
        <button class="btn primary" id="confirmMapBtn" onclick="enterGame()">⚔️ 进入战斗</button>
      </div>
    </div>
  </div>

  <!-- 商店弹窗 -->
  <div id="shopModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2>🛒 武器商店</h2>
        <button class="close" onclick="closeShop()">×</button>
      </div>
      <div class="modal-body">
        <div style="margin-bottom:12px;padding:8px 12px;background:rgba(255,213,79,.1);border:1px solid #ffd54f;border-radius:6px;font-size:13px">
          💰 金币：<b id="shopCoins">0</b> · ⭐ 等级：<b id="shopLevel">1</b>
          <div style="font-size:11px;opacity:.7;margin-top:2px">猫咪等级越高血量越多，当前血量上限：<b id="shopHpMax">100</b></div>
        </div>
        <div id="shopList" class="weapon-grid"></div>
      </div>
    </div>
  </div>

  <!-- 数据弹窗 -->
  <div id="statsModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2>📊 我的数据</h2>
        <button class="close" onclick="closeStats()">×</button>
      </div>
      <div class="modal-body" id="statsBody"></div>
    </div>
  </div>

  <!-- 升级确认弹窗 -->
  <div id="upgradeModal" class="modal hidden">
    <div class="modal-box" style="max-width:380px">
      <div class="modal-header">
        <h2 id="upgradeTitle">升级武器</h2>
        <button class="close" onclick="closeUpgrade()">×</button>
      </div>
      <div class="modal-body" id="upgradeBody"></div>
      <div class="modal-footer">
        <button class="btn" onclick="closeUpgrade()">取消</button>
        <button class="btn primary" id="upgradeConfirmBtn">升级</button>
      </div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" style="display:none">
    <button class="back" onclick="backToMenu()">←</button>
    <div class="hpbar"><div class="hpfill" id="hpFill"></div><div class="hptext" id="hpText">100/100</div></div>
    <span><span class="lbl">🗺️</span><span class="val" id="mapName">--</span></span>
    <span><span class="lbl">⚔️</span><span class="val" id="killCount">0</span></span>
    <span style="font-size:12px;opacity:.7">
      <span class="online-dot"></span><span id="hudOnline">0</span>
    </span>
    <span style="font-size:12px;opacity:.7" title="本图真人玩家（含你）" id="playerCountWrap">
      👥 <span id="playerCount">1</span>
      <span id="wsStatus" title="多人连线状态">🟡</span>
    </span>
    <span style="font-size:11px;opacity:.6" title="帧率 + WS 往返延迟（毫秒）" id="perfBadge">
      ⚡<span id="fpsVal">--</span>fps · <span id="rttVal">--</span>ms
    </span>
  </div>

  <!-- 底部武器栏 -->
  <div id="weaponBar" style="display:none"></div>

  <!-- 控制 -->
  <div id="joystick" style="display:none">
    <div class="base"></div>
    <div class="stick" id="stick"></div>
  </div>
  <button id="fireBtn" style="display:none">开火</button>
  <button id="reloadBtn" style="display:none">换弹</button>

  <!-- 击杀提示 -->
  <div id="killFeed"></div>

  <!-- 页面内提示（替代 alert） -->
  <div id="tip"></div>

  <!-- 死亡遮罩 -->
  <div id="deathOverlay" class="hidden">
    <h2>💀 你挂了</h2>
    <p>击杀数: <b id="deathKills">0</b></p>
    <button class="btn primary" onclick="respawn()">🔄 复活</button>
    <button class="btn" style="margin-top:8px" onclick="backToMenu()">返回主菜单</button>
  </div>

  <canvas id="game" style="position:absolute;inset:0;width:100%;height:100%;background:#2a4d3a;display:none"></canvas>
</div>

<script>
// ============== 全局状态 ==============
const state = {
  screen: 'menu',  // menu | mapSelect | playing
  workerUrl: (typeof location !== 'undefined' ? location.origin : ''),
  token: '',
  online: 0,
  coins: 0,
  level: 1,
  kills: 0,
  selectedMap: null,
  selectedWeapon: 'pistol',
  weapons: {},     // 武器拥有 & 升级
  stats: { games: 0, wins: 0, totalKills: 0, bestKills: 0 },
  loggedIn: false,
  nickname: '',
  username: '',
  players: [],     // 当前在线玩家
  // ===== 防清空护栏：未加载完前禁止推空数据到服务端 =====
  _loaded: false,         // loadShootData 完成后才置 true（之前为默认状态不允许推 saveShootData）
  _loading: false,        // 加载中标记
  _loadTs: 0,             // 加载完成时间戳（用于调试）
  _initialCoins: 0,       // 加载前初始金币，用于识别"未加载误推"
};

// ============== 武器定义 ==============
const WEAPONS = {
  pistol:   { name:'手枪',   icon:'🔫', price:0,    damage:18, fireRate:380, range:380, ammo:12, reload:1500, speed:14, knockback:60,  desc:'基础武器, 免费赠送' },
  smg:      { name:'冲锋枪', icon:'🔫', price:300,  damage:12, fireRate:90,  range:320, ammo:30, reload:1800, speed:16, knockback:40,  desc:'射速快, 伤害低' },
  rifle:    { name:'步枪',   icon:'🎯', price:600,  damage:28, fireRate:180, range:520, ammo:25, reload:2000, speed:15, knockback:80,  desc:'均衡型, 射程远' },
  shotgun:  { name:'霰弹枪', icon:'💥', price:800,  damage:14, fireRate:700, range:240, ammo:6,  reload:2200, speed:12, knockback:140, desc:'近战爆发, 一次 5 颗弹丸' },
  sniper:   { name:'狙击枪', icon:'🎯', price:1500, damage:90, fireRate:1100,range:900, ammo:5,  reload:2500, speed:11, knockback:160, desc:'超远射程, 一击致命' },
  rocket:   { name:'火箭筒', icon:'🚀', price:2500, damage:120,fireRate:1500,range:600, ammo:1,  reload:3000, speed:9,  knockback:200, desc:'范围伤害, 慢速' }
};

// ============== 地图定义 ==============
// 地图定义：name, size, 背景色, 装饰纹理, 墙体/掩体, 可破坏物
const MAPS = {
  // 经典竞技场：四边形掩体
  arena: {
    name:'竞技场', emoji:'🏟️', size:{w:2200,h:1500}, bg:'#3a5d3a', gridColor:'rgba(255,255,255,.06)',
    bgPattern:'grass', theme:{sky:'#2a4d3a', accent:'#6b8e23', ground:'#3a5d3a'},
    walls:[
      // 中心方形掩体
      {x:1000,y:650,w:200,h:200,type:'stone'},
      // 四角掩体
      {x:300,y:250,w:140,h:140,type:'stone'},
      {x:1760,y:250,w:140,h:140,type:'stone'},
      {x:300,y:1110,w:140,h:140,type:'stone'},
      {x:1760,y:1110,w:140,h:140,type:'stone'},
      // 长墙掩体
      {x:700,y:400,w:300,h:30,type:'wall'},
      {x:1200,y:400,w:300,h:30,type:'wall'},
      {x:700,y:1070,w:300,h:30,type:'wall'},
      {x:1200,y:1070,w:300,h:30,type:'wall'}
    ],
    decor:[
      // 树木
      {type:'tree',x:150,y:600},{type:'tree',x:2050,y:600},
      {type:'tree',x:150,y:900},{type:'tree',x:2050,y:900},
      {type:'tree',x:600,y:150},{type:'tree',x:1600,y:1350},
      // 桶
      {type:'barrel',x:850,y:720},{type:'barrel',x:1350,y:720},
      {type:'barrel',x:1100,y:650},{type:'barrel',x:1100,y:850},
      // 草丛
      {type:'bush',x:500,y:300},{type:'bush',x:1700,y:1100},
      {type:'bush',x:900,y:1100},{type:'bush',x:1300,y:300}
    ],
    spawns:[{x:200,y:200},{x:2000,y:200},{x:200,y:1300},{x:2000,y:1300}]
  },
  // 复杂迷宫
  maze: {
    name:'迷宫', emoji:'🧱', size:{w:2400,h:1600}, bg:'#3a3a2a', gridColor:'rgba(255,255,255,.05)',
    theme:{sky:'#2a2a1a', accent:'#8b7355', ground:'#3a3a2a'},
    walls:[
      {x:0,y:300,w:2400,h:20,type:'wall'},{x:0,y:1300,w:2400,h:20,type:'wall'},
      {x:200,y:0,w:20,h:600},{x:200,y:1000,w:20,h:600},
      {x:600,y:200,w:20,h:600},{x:600,y:1100,w:20,h:500},
      {x:1000,y:0,w:20,h:500},{x:1000,y:900,w:20,h:700},
      {x:1400,y:200,w:20,h:600},{x:1400,y:1100,w:20,h:500},
      {x:1800,y:0,w:20,h:500},{x:1800,y:900,w:20,h:700},
      {x:2200,y:200,w:20,h:1300},
      // 内部小墙
      {x:400,y:500,w:300,h:20,type:'wall'},{x:800,y:500,w:300,h:20,type:'wall'},

// 页面内轻量提示，替代 alert（遮罩式：点背景或按钮即关闭，不会卡死）
let tipTimer = null;
function showTip(msg, opts) {
  opts = opts || {};
  const el = $('tip');
  if (!el) { console.warn('[tip] no #tip element'); return; }
  clearTimeout(tipTimer);
  const btnHtml = opts.btn ? `<div style="margin-top:12px"><button class="tip-btn">${opts.btn.text}</button></div>` : '';
  el.innerHTML = `<div class="tip-box"><div>${msg}</div>${btnHtml}</div>`;
  el.classList.add('show');
  // 按钮单独绑定事件并阻止冒泡，避免与遮罩背景点击混淆
  const btnEl = el.querySelector('.tip-btn');
  if (btnEl && opts.btn) {
    btnEl.onclick = (ev) => {
      ev.stopPropagation();
      el.classList.remove('show');
      clearTimeout(tipTimer);
      try { opts.btn.cb && opts.btn.cb(); } catch(e) {}
    };
  }
  // 仅当点击遮罩背景本身（#tip）时关闭；点提示框内容不关闭
  el.onclick = (ev) => {
    if (ev.target === el) {
      el.classList.remove('show');
      clearTimeout(tipTimer);
    }
  };
  if (opts.autoClose !== false) {
    tipTimer = setTimeout(() => { el.classList.remove('show'); }, opts.duration || 2800);
  }
}

// ============== 数据加载/保存 (服务器存档 + 本地缓存) ==============
let saveDebounce = null;
async function loadShootData() {
  state._loading = true;
  // 强制读取最新 token
  try {
    const tok = localStorage.getItem('catworld.token') || '';
    if (tok) apiHeaders['authorization'] = 'Bearer ' + tok;
  } catch(e) {}

  if (!apiHeaders['authorization']) {
    console.warn('[shoot] no token, loading from local only');
    loadFromLocal();
    state._loaded = true;  // 本地有/无数据都视为已加载（仅本地模式）
    state._loadTs = Date.now();
    state._loading = false;
    return;
  }

  try {
    const r = await fetch('/shoot-load', { headers: apiHeaders, credentials: 'include' });
    const j = await r.json();
    if (j && j.data) {
      const d = j.data;
      state.coins = d.coins || 0;
      state.level = d.level || 1;
      state.selectedWeapon = d.selectedWeapon || 'pistol';
      state.weapons = d.weapons || { pistol: { owned: true, level: 1 } };
      state.stats = d.stats || state.stats;
      state.loggedIn = true;
      state.nickname = (d.nickname) || state.nickname;
      console.log('[shoot] loaded from server, coins=' + state.coins);
    } else {
      console.log('[shoot] no server save, using local');
      loadFromLocal();
    }
  } catch (e) {
    console.warn('[shoot] server load err', e);
    loadFromLocal();
  }
  if (!state.weapons.pistol) state.weapons.pistol = { owned: true, level: 1 };
  // ===== 防清空护栏：标记加载完成，此后 saveShootData 才允许推服务端 =====
  state._initialCoins = state.coins;
  state._loaded = true;
  state._loadTs = Date.now();
  state._loading = false;
  console.log('[shoot] load done, coins=' + state.coins + ', weapons=' + Object.keys(state.weapons).length);
  updateLoginBadge();
  renderWeaponSelect && renderWeaponSelect();
}
function loadFromLocal() {
  try {
    const raw = localStorage.getItem('cat-shoot-data');
    if (raw) {
      const d = JSON.parse(raw);
      state.coins = d.state?.coins || 0;
      state.level = d.state?.level || 1;
      state.selectedWeapon = d.state?.selectedWeapon || 'pistol';
      state.weapons = d.weapons || { pistol: { owned: true, level: 1 } };
      state.stats = d.stats || state.stats;
    } else {
      state.weapons = { pistol: { owned: true, level: 1 } };
    }
  } catch(e) { console.error('load err', e); state.weapons = { pistol: { owned: true, level: 1 } }; }
}
function saveShootData(force) {
  saveToLocal();
  // ===== 防清空护栏：未加载完时拒绝推送服务端（避免初始空数据覆盖云端）=====
  if (!state._loaded) {
    console.warn('[shoot] save blocked: data not loaded yet (coins=' + state.coins + ', weapons=' + Object.keys(state.weapons).length + ')');
    return;
  }
  if (saveDebounce) clearTimeout(saveDebounce);
  if (force) {
    sendToServer();
  } else {
    saveDebounce = setTimeout(sendToServer, 1500);
  }
}
// ===== 金币统一：把当前 state.coins 推送到主 player: KV =====
let __coinsSyncInflight = null;
let __coinsSyncPending = false;
let __coinsSyncLastSentCoins = -1;
async function syncCoinsToMain(allowDecrease) {
  if (!state._loaded) return;
  if (!apiHeaders['authorization']) {
    try {
      const tok = localStorage.getItem('catworld.token') || '';
      if (tok) apiHeaders['authorization'] = 'Bearer ' + tok;
    } catch (e) {}
  }
  if (!apiHeaders['authorization']) return;
  // 简易节流：相同金币不重复推
  if (state.coins === __coinsSyncLastSentCoins) return;
  if (__coinsSyncInflight) { __coinsSyncPending = true; return; }
  __coinsSyncInflight = (async () => {
    try {
      const r = await fetch('/shoot-coins-sync', {
        method: 'POST',
        headers: Object.assign({ 'content-type': 'application/json' }, apiHeaders),
        credentials: 'include',
        body: JSON.stringify({ coins: state.coins, allowDecrease: !!allowDecrease, ts: Date.now() })
      });
      const j = await r.json().catch(() => ({}));
      if (r.ok && j && j.ok) {
        __coinsSyncLastSentCoins = state.coins;
        // 服务端若给了更权威的金币数（防回滚），同步回本地
        if (typeof j.coins === 'number' && j.coins !== state.coins && j.source === 'normal') {
          console.log('[shoot] coinsync server override: ' + state.coins + ' → ' + j.coins);
          state.coins = j.coins;
          updateCoinsHud && updateCoinsHud();
        }
        console.log('[shoot] coinsync → main player KV, coins=' + state.coins + ', source=' + j.source);
      } else {
        console.warn('[shoot] coinsync failed', r.status, j && j.error);
      }
    } catch (e) {
      console.warn('[shoot] coinsync err', e);
    } finally {
      __coinsSyncInflight = null;
      if (__coinsSyncPending) {
        __coinsSyncPending = false;
        // 用最新 state.coins 再发一次
        syncCoinsToMain(allowDecrease);
      }
    }
  })();
}
function saveToLocal() {
  try {
    localStorage.setItem('cat-shoot-data', JSON.stringify({
      state: { coins: state.coins, level: state.level, selectedWeapon: state.selectedWeapon },
      weapons: state.weapons,
      stats: state.stats
    }));
  } catch(e) {}
}
async function sendToServer() {
  // 强制重新读取最新 token
  try {
    if (!apiHeaders['authorization']) {
      const tok = localStorage.getItem('catworld.token') || '';
      if (tok) {
        apiHeaders['authorization'] = 'Bearer ' + tok;
        console.log('[shoot] token re-read:', tok.substring(0, 8) + '...');
      }
    }
  } catch(e) {}
  
  if (!apiHeaders['authorization']) {
    console.warn('[shoot] no token, skipping server save');
    return;
  }

  // ===== 金币统一：shoot-save 不再权威保存 coins，只同步武器/等级/统计 =====
  // 金币走 /shoot-coins-sync 推送到主 player: KV（与主页面共用一个池）
  syncCoinsToMain(false);

  try {
    const payload = {
      // 仍带 coins 字段以兼容旧服务端逻辑（服务端会用 prev/next 较大值兜底）
      coins: state.coins,
      level: state.level,
      selectedWeapon: state.selectedWeapon,
      weapons: state.weapons,
      stats: state.stats
    };
    const r = await fetch('/shoot-save', {
      method: 'POST',
      headers: { 'content-type': 'application/json', ...apiHeaders },
      credentials: 'include',
      body: JSON.stringify(payload)
    });
    if (r.ok) {
      console.log('[shoot] saved to server, coins=' + state.coins);
    } else if (r.status === 401) {
      console.warn('[shoot] 401 unauthorized, token invalid');
      state.loggedIn = false;
      updateLoginBadge();
    } else if (r.status === 409) {
      // 服务端拒绝了回滚（保护云端存档）
      console.warn('[shoot] 409 rollback rejected — server protected your save');
      try {
        const j = await r.json();
        if (j && j.error) console.warn('[shoot] server msg:', j.error);
      } catch (_) {}
    } else {
      console.warn('[shoot] save failed, status=' + r.status);
    }
  } catch (e) { 
    console.warn('[shoot] save err', e); 
  }
}
function getWeaponDmg(key) {
  const w = WEAPONS[key];
  if (!w) return 0;
  const lvl = (state.weapons[key] && state.weapons[key].level) || 1;
  return Math.round(w.damage * (1 + (lvl - 1) * 0.18));
}
function getWeaponAmmo(key) {
  const w = WEAPONS[key];
  if (!w) return 0;
  const lvl = (state.weapons[key] && state.weapons[key].level) || 1;
  return w.ammo + Math.floor((lvl - 1) * 1.5);
}
function getHpMax() { return 100 + (state.level - 1) * 30; }
function getUpgradeCost(key) {
  const w = WEAPONS[key];
  if (!w) return Infinity;
  const lvl = (state.weapons[key] && state.weapons[key].level) || 1;
  return Math.floor(w.price * 0.6 * lvl);
}

async function manualSync() {
  const btn = (typeof event !== 'undefined' && event && event.target) ? event.target : null;
  if (btn) btn.textContent = '同步中...';
  // ===== 防清空护栏：未加载完时阻止手动同步 =====
  if (!state._loaded) {
    if (btn) btn.textContent = '☁️ 手动同步';
    showTip('⚠️ 数据还在加载中，请稍候再试。', { autoClose: true });
    return;
  }
  // 先保存本地
  saveToLocal();
  // 强制读取 token
  const tok = localStorage.getItem('catworld.token') || '';
  if (tok) {
    apiHeaders['authorization'] = 'Bearer ' + tok;
  }
  // 未登录：不弹 alert，用页面内提示并引导回主世界登录
  if (!apiHeaders['authorization']) {
    if (btn) btn.textContent = '☁️ 手动同步';
    showTip('⚠️ 未登录，无法同步到云端。<br>请先返回主世界登录账号。', {
      autoClose: false,
      btn: { text: '↩️ 返回主世界登录', cb: () => { window.location.href = 'index.html'; } }
    });
    return;
  }
  // 发送到服务器
  await sendToServer();
  // 再从服务器拉取一次
  await loadShootData();
  if (btn) btn.textContent = '☁️ 手动同步';
  showTip('✅ 同步完成！<br>💰 金币：' + state.coins + ' · ⭐ 等级：' + state.level);
}

      </div>
    </div>`;
  }).join('');

  setTimeout(() => {
    document.querySelectorAll('canvas[data-map]').forEach(c => {
      const key = c.dataset.map;

      // 渐变背景

      g.addColorStop(0, m.theme.sky);
      g.addColorStop(1, m.theme.ground);
      ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
      // 网格
      ctx.strokeStyle = m.gridColor || 'rgba(255,255,255,.08)';
      ctx.lineWidth = .5;
      for (let x = 0; x < c.width; x += 18) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, c.height); ctx.stroke();
      }
      for (let y = 0; y < c.height; y += 18) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(c.width, y); ctx.stroke();
      }
      // 装饰物（按类型简化）
      if (m.decor) {
        ctx.fillStyle = 'rgba(255,255,255,.35)';
        m.decor.slice(0, 12).forEach(d => {
          const x = d.x / m.size.w * c.width;
          const y = d.y / m.size.h * c.height;
          ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill();
        });
      }
      // 掩体（按类型简化着色）
      m.walls.forEach(w => {
        const x = w.x / m.size.w * c.width;
        const y = w.y / m.size.h * c.height;
        const ww = w.w / m.size.w * c.width;
        const hh = w.h / m.size.h * c.height;
        const colors = {
          stone:'#888', wall:'#8a5a30', ice:'#a8d5e2', building:'#555',
          'crate-pile':'#a06030', metal:'#4a5a6a'
        };
        ctx.fillStyle = colors[w.type] || '#666';
        ctx.fillRect(x, y, Math.max(2, ww), Math.max(2, hh));
        ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = .5; ctx.strokeRect(x, y, Math.max(2, ww), Math.max(2, hh));
      });
    });
  }, 50);
}

function pointInWall(x, y, r, walls) {
  // 圆心 + 半径 r 的圆，与任一墙体 AABB 是否重叠
  for (const w of (walls || [])) {
    if (x + r > w.x && x - r < w.x + w.w && y + r > w.y && y - r < w.y + w.h) return true;
  }
  return false;
}
function findSafeSpawn(map, r) {
  const margin = 60; // 距地图边缘
  const w = map.size.w, h = map.size.h;
  // 优先用 map.spawns（如果有）
  if (Array.isArray(map.spawns) && map.spawns.length) {
    // 过滤掉卡墙的 spawn，找不到再退化
    const safe = map.spawns.filter(s => !pointInWall(s.x, s.y, r, map.walls));
    if (safe.length) return Object.assign({}, pick(safe));
    // 全卡墙：退回随机点策略
  }
  // 兜底：在地图内 60px 边距内找 200 次随机点，找不到就在中心画个圆尽量远离最近墙
  for (let i = 0; i < 200; i++) {
    const x = rand(margin, w - margin);
    const y = rand(margin, h - margin);
    if (!pointInWall(x, y, r, map.walls)) return { x, y };
  }
  // 200 次都失败（地图几乎全是墙）：返回中心点（至少不会卡死，但可能在墙内）
  return { x: Math.max(margin, Math.min(w - margin, w / 2)), y: Math.max(margin, Math.min(h - margin, h / 2)) };
}
function respawn() {
  $('deathOverlay').classList.add('hidden');
  if (game.player) {
    game.player.hp = getHpMax();
    const safe = findSafeSpawn(game.map, game.player.r || 16);
